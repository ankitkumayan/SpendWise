services:
  postgres:
    image: postgres:17
    container_name: spendwise-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spendwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./SpendWise.Api
      dockerfile: Dockerfile
    container_name: spendwise-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5238
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
    ports:
      - "5238:5238"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./spendwise
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5238/api
    container_name: spendwise-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data: